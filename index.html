<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="description" content="Progetta e stampa etichette su LabelWriter 550 via USB, direttamente dal browser." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='16' rx='3' fill='%231f2937'/%3E%3Crect x='7' y='13' width='18' height='2' fill='%23fff'/%3E%3Crect x='7' y='17' width='12' height='2' fill='%23fff'/%3E%3C/svg%3E" />
    <title>Etichettatrice</title>
    <script>
      // Applica il tema salvato prima del primo disegno (evita il lampo bianco).
      try {
        var t = localStorage.getItem('etichettatrice.tema');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Questa app richiede JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
