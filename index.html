<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#1f2937" />
    <meta
      name="description"
      content="Progetta e stampa etichette su LabelWriter 550 via USB, direttamente dal browser."
    />
    <link rel="icon" type="image/svg+xml" href="icona.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="icona-192.png" />
    <link rel="apple-touch-icon" href="icona-180.png" />
    <title>Etichettatrice</title>
    <script>
      // Applica il tema salvato prima del primo disegno (evita il lampo bianco).
      try {
        var t = localStorage.getItem('etichettatrice.tema');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Questa app richiede JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
